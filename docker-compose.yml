services:
  db:
    image: postgres:16-alpine
    container_name: sheltersync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sheltersync
      POSTGRES_USER: sheltersync
      POSTGRES_PASSWORD: sheltersync_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
